name: Import site from dev.lewisworks.uk

on:
  push:
    paths:
      - '.github/workflows/import-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack site export
        run: |
          curl -fsSL -A "Mozilla/5.0 (GitHub Actions import)" -o /tmp/site.zip "https://dev.lewisworks.uk/pe-export-7f3k9q.zip"
          unzip -q /tmp/site.zip -d .
          echo "purpleemperordesigns.co.uk" > CNAME
          touch .nojekyll

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import site from dev.lewisworks.uk" || echo "Nothing to commit"
          git push
